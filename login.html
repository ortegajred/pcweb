<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iWant PC - Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body data-page="login">
    <div class="login-container">
        <div class="login-header">
            <img src="pc.png" alt="iWant PC logo" class="login-logo">
            <h2>Welcome</h2>
            <p>Please enter your details to sign in</p>
        </div>

        <form class="login-form" id="loginForm">
            <div class="input-group">
                <label for="email">Email Address</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-envelope field-icon"></i>
                    <input type="email" id="email" placeholder="name@example.com" autocomplete="email" required>
                </div>
            </div>
            <div class="input-group">
                <label for="password">Password</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-lock field-icon"></i>
                    <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password" required>
                </div>
            </div>
            <div class="form-actions">
                <label class="remember-me"><input type="checkbox" id="remember" checked><span>Remember me</span></label>
            </div>
            <p class="form-msg" id="formMsg" role="alert"></p>
            <button type="submit" class="btn-submit">Sign In</button>
        </form>

        <div class="login-footer">
            <p>Don't have an account? <a href="signup.html">Sign up</a></p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
